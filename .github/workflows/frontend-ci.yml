
name: Frontend CI and CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Lint, Test, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare artefact directories
        run: |
          mkdir -p logs
          mkdir -p test-results

      # CONTINUOUS INTEGRATION

      - name: Run ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee logs/eslint.log

      - name: Run Vitest
        run: |
          set -o pipefail
          npm run test -- \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit=test-results/junit.xml \
            2>&1 | tee logs/vitest.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee logs/build.log

      # ARTEFACT RETENTION

      - name: Upload frontend CI artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            test-results/
            dist/
          if-no-files-found: warn
          retention-days: 30

      # CONTINUOUS DEPLOYMENT

      - name: Deploy to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes netlify-cli deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
