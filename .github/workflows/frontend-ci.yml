
name: Frontend CI and CD

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Lint, Test, Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # CONTINUOUS INTEGRATION
      - name: Run frontend validation
        uses: ./.github/actions/frontend-validation
        with:
          node-version: "22"
          api-url: ${{ vars.VITE_API_URL }}

      # ARTEFACT RETENTION
      - name: Upload frontend CI artefacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            test-results/
            dist/
          if-no-files-found: warn
          retention-days: 30

      # CONTINUOUS DEPLOYMENT
      - name: Deploy to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx --yes netlify-cli deploy --prod --no-build --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
