name: Frontend Validation
description: Install dependencies, lint, test with coverage and build the Village Wellness frontend

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  api-url:
    description: Backend API URL used during the production build
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Prepare artefact directories
      shell: bash
      run: |
        mkdir -p logs
        mkdir -p test-results

    - name: Run ESLint
      shell: bash
      run: |
        set -o pipefail
        npm run lint 2>&1 | tee logs/eslint.log

    - name: Run Vitest with coverage
      shell: bash
      run: |
        set -o pipefail
        npm run test:coverage -- \
          --reporter=default \
          --reporter=junit \
          --outputFile.junit=test-results/junit.xml \
          2>&1 | tee logs/vitest.log

    - name: Build production frontend
      shell: bash
      env:
        VITE_API_URL: ${{ inputs.api-url }}
      run: |
        set -o pipefail
        npm run build 2>&1 | tee logs/build.log